# alembic.ini
# -----------
# Alembic configuration file.
#
# IMPORTANT: sqlalchemy.url is intentionally left empty here.
# It is overridden at runtime in alembic/env.py using the value from
# app.core.config.settings.DATABASE_URL, which reads from environment
# variables / .env — keeping credentials out of source control.

[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
version_path_separator = os
truncate_slug_length = 40

# Left blank — overridden by env.py via app.core.config.settings.DATABASE_URL
sqlalchemy.url =

[post_write_hooks]
# Uncomment to auto-format generated migration scripts:
# hooks = ruff
# ruff.type = exec
# ruff.executable = %(here)s/.venv/Scripts/ruff.exe
# ruff.options = check --fix REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
