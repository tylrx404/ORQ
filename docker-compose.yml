services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: orq-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./apps/api/.env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-orq}:${POSTGRES_PASSWORD:-orq_password}@postgres:5432/${POSTGRES_DB:-orq_db}
      - REDIS_URL=redis://redis:6379/0
      
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orq-network

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: orq-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orq-network

  postgres:
    image: postgres:16-alpine
    container_name: orq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orq_password}
      POSTGRES_DB: ${POSTGRES_DB:-orq_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-orq} -d $${POSTGRES_DB:-orq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - orq-network

  redis:
    image: redis:7-alpine
    container_name: orq-redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - orq-network

networks:
  orq-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
